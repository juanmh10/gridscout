services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketradar_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketradar}
      POSTGRES_USER: ${POSTGRES_USER:-marketradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketradar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketradar} -d ${POSTGRES_DB:-marketradar}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
